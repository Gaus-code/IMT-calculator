<!DOCTYPE html>
<html>
<head>
    <title>Калькулятор ИМТ</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
        form { padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        input { padding: 5px; width: 200px; }
        button { padding: 8px 20px; background: #007bff; color: white; border: none; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Калькулятор индекса массы тела</h1>
    <form action="/calculate" method="post">
        <div class="form-group">
            <label>Рост (см):</label>
            <input type="number" name="height" step="0.1" required>
        </div>
        <div class="form-group">
            <label>Вес (кг):</label>
            <input type="number" name="weight" step="0.1" required>
        </div>
        <button type="submit">Рассчитать</button>
    </form>
</body>
</html>
